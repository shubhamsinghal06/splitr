<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Splitr — a lightweight Splitwise-style expense splitter PWA. Works offline." />
  <title>Splitr</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <button class="icon-btn back-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 id="headerTitle">Splitr</h1>
    <span class="header-spacer"></span>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer" role="contentinfo">
    <span class="version" id="versionLabel" aria-label="App version">v–</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
